name: Google Sheets Auto Sync

on:
  schedule:
    # Tự động quét Google Sheet mỗi 1 tiếng trên Cloud
    - cron: '0 * * * *'
  repository_dispatch:
    # Triggered instantly via Google Apps Script webhook
    types: [gsheets_updated]
  workflow_dispatch:
    # Manual trigger button in GitHub Actions

concurrency:
  group: sync-gsheets
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Google Sheets to Web
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync from Google Sheets
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$SPREADSHEET_ID" ] || [ -z "$GCP_SA_KEY" ]; then
            echo "::warning ::SPREADSHEET_ID hoặc GCP_SA_KEY chưa được cấu hình. Bỏ qua bước đồng bộ."
            exit 0
          fi
          python -m src.sync_gsheets --no-push

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --staged --quiet || (git commit -m "auto: sync data from Google Sheets [skip ci]" && git push)
